[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weinc"
version = "0.1.0"
description = "WeInc AI website builder API client for the WeInc v1 REST API (projects, publish, preview, domains). Pure stdlib, zero dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "WeInc", email = "support@weinc.dev" }]
keywords = [
  "weinc",
  "ai-website-builder",
  "website-builder",
  "api-client",
  "sdk",
  "ai",
  "no-code",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://we.inc"
Documentation = "https://my.we.inc/docs/api"
Repository = "https://github.com/umairalisadaqat/weinc-sdk"
Issues = "https://github.com/umairalisadaqat/weinc-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/weinc"]
